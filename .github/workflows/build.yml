name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder android
        run: bash tools/setup_android.sh

      - run: flutter pub get

      - name: Pasang ikon app
        run: dart run flutter_launcher_icons

      # --no-shrink wajib, kalau tidak R8 membuang method JavascriptInterface
      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: ArupijiPlay-apk-v1.0.0
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
