name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder android
        run: bash tools/setup_android.sh

      - run: flutter pub get

      - name: Pasang ikon app
        run: dart run flutter_launcher_icons

      # --no-shrink wajib agar R8 tidak membuang method JavascriptInterface
      - run: flutter build apk --release --no-shrink

      - name: Upload APK ke Pixeldrain
        run: |
          echo "Mengunggah file APK ke Pixeldrain..."
          RESPONSE=$(curl -s -F file=@build/app/outputs/flutter-apk/app-release.apk https://pixeldrain.com/api/file/)
          echo "Respon server: $RESPONSE"
          
          FILE_ID=$(echo $RESPONSE | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)
          
          echo ""
          echo "===================================================="
          echo "🎉 LINK DOWNLOAD PIXELDRAIN YANG BENAR:"
          echo "https://pixeldrain.com/u/$FILE_ID"
          echo "===================================================="
