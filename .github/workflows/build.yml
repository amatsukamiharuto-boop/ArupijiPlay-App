name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder android
        run: bash tools/setup_android.sh

      - run: flutter pub get

      - name: Pasang ikon app
        run: dart run flutter_launcher_icons

      # --no-shrink wajib, dan --split-per-abi supaya ukurannya lebih kecil
      - run: flutter build apk --release --no-shrink --split-per-abi

      - name: Upload APK ke Transfer.sh
        run: |
          echo "Mengunggah file APK ke transfer.sh..."
          curl --upload-file build/app/outputs/flutter-apk/app-release-arm64-v8a.apk https://transfer.sh/ArupijiPlay-release.apk
          echo ""
          echo "Selesai! Silakan copy link di atas untuk mendownload APK."
