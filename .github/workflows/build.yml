name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dibutuhkan agar workflow boleh membuat Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder android
        run: bash tools/setup_android.sh

      - run: flutter pub get

      - name: Pasang ikon app
        run: dart run flutter_launcher_icons

      # --no-shrink wajib, kalau tidak R8 membuang method JavascriptInterface
      - run: flutter build apk --release --no-shrink

      # APK dikirim ke halaman Releases. Ini tidak memakai kuota artifact Actions.
      # Satu rilis bernama "latest" yang file APK-nya ditimpa tiap build.
      - name: Unggah APK ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ArupijiPlay terbaru (build ${{ github.run_number }})
          body: "APK hasil build nomor ${{ github.run_number }}. Unduh file app-release.apk di bawah."
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
          overwrite_files: true

      # Cadangan lewat artifact. Kalau kuota penuh, langkah ini boleh gagal tanpa menggagalkan build.
      - name: Unggah artifact (cadangan)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ArupijiPlay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
          compression-level: 0
