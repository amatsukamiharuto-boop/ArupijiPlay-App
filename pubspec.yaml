name: arupiji_play
description: Launcher game RPG Maker untuk Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/arupijiplay_icon.png"
  adaptive_icon_background: "#14181F"
  adaptive_icon_foreground: "assets/images/arupijiplay_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
